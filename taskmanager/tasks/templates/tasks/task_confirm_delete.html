{% extends 'base.html' %}
{% block title %}Xoá công việc{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h3 class="card-title text-danger">Xác nhận xoá</h3>
                <p>Bạn có chắc chắn muốn xoá công việc <strong>"{{ task.title }}"</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Xác nhận xoá</button>
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">Huỷ</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
