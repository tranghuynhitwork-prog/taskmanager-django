<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quản lý công việc{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'task_list' %}"> Task Manager</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <span class="text-white">Xin chào, <strong>{{ user.username }}</strong></span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Đăng xuất</a>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Đăng nhập</a>
                <a class="btn btn-light btn-sm" href="{% url 'register' %}">Đăng ký</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
